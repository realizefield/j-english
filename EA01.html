<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>爆速英文法｜EA01 be動詞(1)</title>
<style>
:root{--primary:#1a56a0;--primary-light:#dbeafe;--accent:#e8372d;--accent-light:#fff1f0;--success:#16a34a;--success-light:#dcfce7;--warn:#d97706;--warn-light:#fffbeb;--orange:#f97316;--bg:#f0f6ff;--card:#fff;--border:#c7d9f5;--text:#1e293b;--text-sub:#64748b;--radius:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:180px;}
/* ヘッダー */
.page-header{background:var(--primary);color:#fff;padding:16px 20px 12px;text-align:center;}
.page-header .unit-code{font-size:.8em;opacity:.8;letter-spacing:.1em;margin-bottom:3px;}
.page-header h1{font-size:clamp(1em,3vw,1.35em);font-weight:700;}
/* ステップナビ */
.step-nav{display:flex;gap:4px;padding:10px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.step-btn{flex:1;padding:9px 4px;border:none;background:#e2e8f0;cursor:pointer;font-weight:700;border-radius:8px;font-size:clamp(.72em,2vw,.85em);font-family:inherit;color:var(--text-sub);touch-action:manipulation;}
.step-btn.active{background:var(--primary);color:#fff;}
.step-btn.completed{background:var(--success);color:#fff;}
/* コンテナ */
.g-container{max-width:640px;margin:0 auto;padding:14px 12px;}
/* タイマーバー */
.timer-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.timer-display{font-size:1.5em;font-weight:700;color:var(--primary);min-width:68px;font-variant-numeric:tabular-nums;}
.btn-start{font-family:inherit;background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:50px;cursor:pointer;font-size:.9em;font-weight:700;width:100%;touch-action:manipulation;}
.challenge-controls{display:none;flex-wrap:wrap;gap:6px;margin-top:6px;}
.challenge-controls.show{display:flex;}
.btn-c{font-family:inherit;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.82em;cursor:pointer;flex:1;touch-action:manipulation;}
/* カード */
.section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.section-title-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.section-num{background:var(--primary);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.82em;font-weight:700;flex-shrink:0;}
.section-title-text{font-weight:700;font-size:.95em;}
.proc-box{background:var(--primary-light);border-radius:10px;padding:12px;margin-bottom:12px;}
.proc-label{font-weight:700;font-size:.85em;color:var(--primary);margin-bottom:8px;}
.proc-step{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
.proc-arrow{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700;flex-shrink:0;margin-top:1px;}
.proc-txt{font-size:.88em;line-height:1.7;}
.origin-box{background:#f8faff;border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.origin-en{font-size:1em;font-weight:700;margin-bottom:4px;line-height:1.6;}
.origin-jp{font-size:.85em;color:var(--text-sub);}
.point-box{background:var(--warn-light);border-radius:10px;padding:12px;margin-top:8px;}
.point-title{font-weight:700;font-size:.85em;color:var(--warn);margin-bottom:6px;}
.point-formula{font-size:.88em;margin-bottom:4px;line-height:1.6;}
.wh{background:#fef08a;padding:1px 4px;border-radius:4px;font-weight:700;}
.voice-btn{background:none;border:none;cursor:pointer;font-size:.9em;padding:0 4px;touch-action:manipulation;}
/* ドリル（info練習問題） */
.drill-box{background:#f8faff;border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.drill-num{font-weight:700;font-size:.85em;color:var(--text-sub);margin-bottom:4px;}
.drill-src{font-size:.9em;margin-bottom:8px;line-height:1.6;}
.bracket-row{display:flex;flex-wrap:wrap;gap:6px;}
/* 文問題（ex/prac/test） */
.sentence-block{background:#f8faff;border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.sentence-jp{font-weight:700;font-size:.93em;margin-bottom:10px;line-height:1.6;}
.word-squares{display:flex;flex-wrap:wrap;gap:6px;}
/* ===== ブランクボタン共通 ===== */
.sq,.bk{
  border:2px solid var(--border);border-radius:8px;
  font-size:.9em;font-weight:700;cursor:pointer;
  touch-action:manipulation;transition:.15s;
  font-family:inherit;
}
.sq{background:#fff;padding:8px 12px;min-width:56px;min-height:40px;}
.bk{background:#fff;padding:6px 10px;min-width:56px;min-height:36px;text-align:center;}
.sq.filled,.bk.filled{background:var(--success-light);border-color:var(--success);color:var(--success);}
.sq.active,.bk.active{background:var(--primary-light);border-color:var(--primary);}
/* ワードプール */
.pool-toggle-bar{position:fixed;bottom:0;left:0;right:0;background:var(--primary);color:#fff;display:none;z-index:51;touch-action:manipulation;}
.pool-toggle-btn{width:100%;padding:10px 14px;background:none;border:none;color:#fff;font-family:inherit;font-size:.9em;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation;}
.pool-selected-word{background:rgba(255,255,255,.25);border-radius:6px;padding:3px 10px;font-size:.88em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fixed-pool{position:fixed;bottom:44px;left:0;right:0;background:var(--card);border-top:2px solid var(--border);padding:10px;z-index:50;max-height:38vh;overflow-y:auto;display:none;transition:transform .2s;}
.pool-inner{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.wcard{background:var(--primary-light);color:var(--primary);border:2px solid transparent;border-radius:8px;padding:7px 12px;font-size:.9em;font-weight:700;cursor:pointer;touch-action:manipulation;font-family:inherit;}
.wcard.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
/* ===== 単語ポップアップ ===== */
.imp{color:var(--primary);font-weight:700;border-bottom:2px dashed var(--primary);cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;}
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px;}
.popup-overlay.show{display:flex;}
.popup-card{background:#fff;border-radius:16px;padding:20px 22px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25);position:relative;}
.popup-word{font-size:1.4em;font-weight:700;color:var(--primary);margin-bottom:4px;}
.popup-kana{font-size:.92em;color:var(--text-sub);margin-bottom:8px;line-height:1.7;}
.popup-kana strong{color:var(--text);}
.popup-meaning{font-size:1em;font-weight:700;padding:8px 12px;background:var(--primary-light);border-radius:8px;margin-bottom:14px;}
.popup-btns{display:flex;gap:8px;}
.popup-btn{flex:1;border:none;padding:10px;border-radius:10px;font-size:.9em;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.popup-speak{background:var(--primary);color:#fff;}
.popup-save{background:var(--success);color:#fff;}
.popup-save.saved{background:#94a3b8;}
/* ===== 単語帳 ===== */
.record-section,.vocab-section{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.sec-title{font-size:.88em;font-weight:700;border-bottom:2px solid;padding-bottom:6px;margin-bottom:10px;}
.sec-title.red{color:var(--accent);border-color:var(--accent);}
.sec-title.green{color:var(--success);border-color:var(--success);}
.record-list{list-style:none;}
.record-list li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:.88em;}
.rec-time{font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;}
.btn-reset{font-family:inherit;background:#e2e8f0;color:var(--text-sub);border:none;padding:6px 14px;border-radius:50px;cursor:pointer;font-size:.8em;margin-top:8px;touch-action:manipulation;}
.vocab-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.88em;}
.vocab-word{font-weight:700;min-width:80px;}
.vocab-info{flex:1;color:var(--text-sub);font-size:.82em;}
.vocab-del{background:none;border:none;color:var(--accent);cursor:pointer;touch-action:manipulation;padding:2px 6px;}
.vocab-empty{font-size:.85em;color:var(--text-sub);padding:6px 0;}
.btn-vocab-test{font-family:inherit;background:var(--success);color:#fff;border:none;padding:8px 18px;border-radius:50px;cursor:pointer;font-size:.85em;font-weight:700;margin-top:8px;touch-action:manipulation;}
/* ===== 単語テスト ===== */
.vtest-q{font-size:1.3em;font-weight:700;text-align:center;color:var(--primary);padding:14px;background:var(--primary-light);border-radius:10px;margin-bottom:14px;}
.vtest-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vtest-btn{font-family:inherit;background:#fff;border:2px solid var(--border);border-radius:10px;padding:12px 8px;font-size:.88em;font-weight:700;cursor:pointer;touch-action:manipulation;}
.vtest-btn.ok{background:var(--success-light);border-color:var(--success);color:var(--success);}
.vtest-btn.ng{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
.vtest-result{text-align:center;padding:10px;font-weight:700;}
.vtest-next{font-family:inherit;background:var(--primary);color:#fff;border:none;padding:9px 22px;border-radius:50px;cursor:pointer;font-size:.88em;font-weight:700;margin-top:8px;touch-action:manipulation;}
/* ナビ */
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.btn-nav{flex:1;padding:12px;border-radius:var(--radius);text-align:center;font-weight:700;font-size:.88em;text-decoration:none;display:block;}
.btn-home{background:#e0e7ff;color:#3730a3;}
.btn-prev{background:#f1f5f9;color:var(--text-sub);}
.btn-next{background:var(--primary-light);color:var(--primary);}

/* ===== 花吹雪 ===== */
.confetti-piece{position:fixed;width:10px;height:10px;top:-20px;z-index:9999;border-radius:2px;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>
<div class="page-header">
  <div class="unit-code">EA01</div>
  <h1>⚡ 爆速英文法：be動詞(1)</h1>
</div>
<nav class="step-nav">
  <button class="step-btn" id="btn-info" onclick="goStep('info')">1.説明</button>
  <button class="step-btn" id="btn-ex"   onclick="goStep('ex')">2.例題</button>
  <button class="step-btn" id="btn-prac" onclick="goStep('prac')">3.類題</button>
  <button class="step-btn" id="btn-test" onclick="goStep('test')">4.テスト</button>
</nav>
<div class="g-container">
  <div class="timer-bar">
    <div class="timer-display" id="timer">00:00</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
      <button class="btn-start" id="start-btn" onclick="startChallenge()">▶ チャレンジ開始！</button>
      <div class="challenge-controls" id="cc">
        <button class="btn-c" style="background:#64748b" onclick="stopChallenge()">⏹ ストップ</button>
        <button class="btn-c" style="background:var(--warn)" onclick="retryChallenge()">↩ 元に戻す</button>
        <button class="btn-c" style="background:#7c3aed" onclick="showAnswers()">👁 答えを見る</button>
      </div>
    </div>
  </div>
  <div id="display-area"></div>
  <div class="record-section">
    <div class="sec-title red">⏱ タイムレコード</div>
    <ul class="record-list" id="rec-list">
      <li><span>1回目</span><span class="rec-time" id="r0">--:--</span></li>
      <li><span>2回目</span><span class="rec-time" id="r1">--:--</span></li>
      <li><span>3回目</span><span class="rec-time" id="r2">--:--</span></li>
      <li><span>4回目</span><span class="rec-time" id="r3">--:--</span></li>
      <li><span>5回目</span><span class="rec-time" id="r4">--:--</span></li>
    </ul>
    <button class="btn-reset" onclick="resetRec()">記録をリセット</button>
  </div>
  <div class="vocab-section">
    <div class="sec-title green">📗 マイ単語帳</div>
    <div id="vocab-list"></div>
    <div class="vocab-empty" id="vocab-empty">単語をタップして保存しよう！</div>
    <button class="btn-vocab-test" onclick="startVtest()">📝 単語テストをする</button>
  </div>
  <div id="vtest-area" style="display:none;"></div>
  <div class="nav-btns">
    <a href="index.html" class="btn-nav btn-home">🏠 単元一覧へ</a>
    
    <a href="EA02.html" class="btn-nav btn-next">EA02 →</a>
  </div>
</div>
<div class="fixed-pool" id="pool"><div class="pool-inner" id="pool-inner"></div></div>
<div class="pool-toggle-bar" id="pool-toggle-bar">
  <button class="pool-toggle-btn" onclick="togglePool()">
    <span id="pool-toggle-label">📝 語群を開く ▲</span>
    <span class="pool-selected-word" id="pool-sel-label">選択中：なし</span>
  </button>
</div>
<!-- 単語ポップアップ -->
<div class="popup-overlay" id="popup" onclick="closePopup(event)" onmouseleave="scheduleClose()">
  <div class="popup-card" onmouseenter="if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;}" onmouseleave="scheduleClose()">
    <button onclick="closePopupBtn()" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.4em;color:var(--text-sub);cursor:pointer;line-height:1;touch-action:manipulation;">✕</button>
    <div class="popup-word" id="pp-word"></div>
    <div class="popup-kana" id="pp-kana"></div>
    <div class="popup-meaning" id="pp-meaning"></div>
    <div class="popup-btns">
      <button class="popup-btn popup-speak" onclick="ppSpeak()">🔊 発音する</button>
      <button class="popup-btn popup-save" id="pp-save" onclick="ppSave()">📗 単語帳に保存</button>
    </div>
  </div>
</div>
<script>
const DICT = {"I": "【ア】イ (代)私は", "am": "【ア】ム (動)be動詞", "You": "【ユ】ー (代)あなたは", "are": "【アー】 (動)be動詞", "He": "【ヒ】ー (代)彼は", "She": "【シ】ー (代)彼女は", "is": "【イ】ズ (動)be動詞", "Japanese": "ジャパ【ニ】ーズ (形)日本の", "student": "ス【テュ】ーデント (名)学生", "soccer": "【サッ】カー (名)サッカー", "player": "プ【レ】イヤー (名)選手", "dentist": "【デ】ンティスト (名)歯医者", "artist": "【アー】ティスト (名)芸術家", "teacher": "【ティ】ーチャー (名)先生", "kind": "【カ】インド (形)親切な", "honest": "【オ】ニスト (形)正直な", "cook": "【クッ】ク (名)料理人", "nurse": "【ナ】ース (名)看護師", "busy": "【ビ】ズィ (形)忙しい"};
const INFO_DRILLS = [{"num": "(1)", "src": "私はサッカー選手です。", "ans": ["I", "am", "a", "soccer", "player"], "jp": "I am a soccer player.", "mark": "."}, {"num": "(2)", "src": "彼は歯医者です。", "ans": ["He", "is", "a", "dentist"], "jp": "He is a dentist.", "mark": "."}, {"num": "(3)", "src": "彼女は芸術家です。", "ans": ["She", "is", "an", "artist"], "jp": "She is an artist.", "mark": "."}];
const MASTER_DATA = {"ex": [{"jp": "私は日本の学生です。", "en": ["I", "am", "a", "Japanese", "student"], "mark": "."}, {"jp": "あなたはサッカー選手です。", "en": ["You", "are", "a", "soccer", "player"], "mark": "."}, {"jp": "彼は歯医者です。", "en": ["He", "is", "a", "dentist"], "mark": "."}, {"jp": "彼女は芸術家です。", "en": ["She", "is", "an", "artist"], "mark": "."}], "prac": [{"jp": "トムは親切な先生です。", "en": ["Tom", "is", "a", "kind", "teacher"], "mark": "."}, {"jp": "私は正直な料理人です。", "en": ["I", "am", "an", "honest", "cook"], "mark": "."}, {"jp": "あなたは日本の学生です。", "en": ["You", "are", "a", "Japanese", "student"], "mark": "."}, {"jp": "彼は芸術家です。", "en": ["He", "is", "an", "artist"], "mark": "."}], "test": [{"jp": "Lucyは正直な先生です。", "en": ["Lucy", "is", "an", "honest", "teacher"], "mark": "."}, {"jp": "彼女は忙しい看護師です。", "en": ["She", "is", "a", "busy", "nurse"], "mark": "."}, {"jp": "それは歯医者です。", "en": ["It", "is", "a", "dentist"], "mark": "."}, {"jp": "私の姉は芸術家です。", "en": ["My", "sister", "is", "an", "artist"], "mark": "."}]};
const INFO_HTML = `<div class="section">
  <div class="section-title-row"><span class="section-num">1</span><span class="section-title-text">be動詞って何？</span></div>
  <p style="line-height:1.9;font-size:.93em;margin-bottom:10px;">英語には「〜です」「〜にいる・ある」を表す特別な動詞があります。それが <strong>be動詞</strong>（ビー動詞）です。be動詞には <strong>am</strong>・<strong>is</strong>・<strong>are</strong> の3種類があり、<span style="color:var(--accent);font-weight:700;">主語によって使い分けます。</span></p>
  <div class="proc-box">
    <div class="proc-label">📌 主語とbe動詞の組み合わせ（必ず覚える！）</div>
    <div class="proc-step"><div class="proc-arrow">①</div><div class="proc-txt"><strong>I（私は）</strong> → <strong style="color:var(--accent);">am</strong><br><small style="color:var(--text-sub);">例：I am a student.（私は学生です。）</small></div></div>
    <div class="proc-step"><div class="proc-arrow">②</div><div class="proc-txt"><strong>You（あなたは）/ We（私たちは）/ They（彼らは）</strong> → <strong style="color:var(--accent);">are</strong><br><small style="color:var(--text-sub);">例：You are a student.（あなたは学生です。）</small></div></div>
    <div class="proc-step"><div class="proc-arrow">③</div><div class="proc-txt"><strong>He（彼は）/ She（彼女は）/ It（それは）/ 人名</strong> → <strong style="color:var(--accent);">is</strong><br><small style="color:var(--text-sub);">例：She is an artist.（彼女は芸術家です。）</small></div></div>
  </div>
  <div class="origin-box"><div class="origin-en">I <strong>am</strong> a Japanese student. <button class="voice-btn" data-sp="I am a Japanese student." onclick="speak(this.dataset.sp)">🔊</button></div><div class="origin-jp">私は日本の学生です。</div></div>
  <div class="origin-box"><div class="origin-en">She <strong>is</strong> an artist. <button class="voice-btn" data-sp="She is an artist." onclick="speak(this.dataset.sp)">🔊</button></div><div class="origin-jp">彼女は芸術家です。</div></div>
</div>
<div class="section">
  <div class="section-title-row"><span class="section-num">2</span><span class="section-title-text">a と an の使い分け</span></div>
  <p style="line-height:1.9;font-size:.93em;margin-bottom:10px;">名詞の前には <strong>a</strong> または <strong>an</strong> をつけます。次にくる単語の<span style="color:var(--accent);font-weight:700;">最初の「音」</span>が母音（ア・イ・ウ・エ・オ）かどうかで決まります。</p>
  <div class="proc-box">
    <div class="proc-label">📌 a と an の決め方</div>
    <div class="proc-step"><div class="proc-arrow">a</div><div class="proc-txt">子音で始まる単語の前<br><small style="color:var(--text-sub);">a student（学生）/ a doctor（医者）/ a kind teacher（親切な先生）</small></div></div>
    <div class="proc-step"><div class="proc-arrow">an</div><div class="proc-txt">母音（ア・イ・ウ・エ・オの音）で始まる単語の前<br><small style="color:var(--text-sub);">an artist（芸術家：アの音）/ an honest cook（正直な料理人：オの音）/ an egg（卵：エの音）</small></div></div>
  </div>
</div>`;
const VOCAB_KEY = 'vocab_EA01';
const REC_KEY   = 'rec_EA01';

let mode='info', challenging=false, selWord=null, selId=null, startT, timerIv;
let recs=[null,null,null,null,null];
let doneSteps={info:false,ex:false,prac:false,test:false};
let ppWord=null;

// ===== ユーティリティ =====
function speak(text){
  if(!window.speechSynthesis) return;
  const synth=window.speechSynthesis;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.82; u.pitch=1.05;
  const vs=synth.getVoices();
  if(vs.length){
    const femaleKeywords=['female','woman','girl','samantha','zira','victoria','karen','moira','fiona','veena','allison','ava','susan','nicky'];
    const enVoices=vs.filter(v=>v.lang==='en-US'||v.lang.startsWith('en'));
    const female=enVoices.find(v=>femaleKeywords.some(k=>v.name.toLowerCase().includes(k)));
    const chosen=female||enVoices[0];
    if(chosen)u.voice=chosen;
  } else {
    synth.onvoiceschanged=()=>{synth.onvoiceschanged=null;};
  }
  try{synth.speak(u);}catch(e){}
}

function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}

function wrapW(word){
  const k=Object.keys(DICT).find(k=>k.toLowerCase()===word.toLowerCase().replace(/[.,?"]/g,''));
  if(k){
    const esc=JSON.stringify(k).replace(/\"/g,'&quot;');
    return '<span class="imp"'
      +' onmouseenter="openPopup('+esc+')"'
      +' onmouseleave="scheduleClose()"'
      +' ontouchstart="event.preventDefault();openPopup('+esc+')"'
      +'>'+word+'</span>';
  }
  return word;
}

// ===== ステップ制御 =====
function goStep(m){
  mode=m; challenging=false; clearInterval(timerIv);
  document.getElementById('timer').textContent='00:00';
  document.getElementById('pool').style.display='none';
  document.getElementById('start-btn').style.display='block';
  document.getElementById('cc').classList.remove('show');
  document.querySelectorAll('.step-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+m).classList.add('active');
  render();
}

// ===== 描画 =====
function render(){
  const area=document.getElementById('display-area');
  if(mode==='info'){
    // 説明HTML + 練習問題
    let drillHtml='<div class="section"><div class="section-title-row"><span class="section-num" style="background:var(--success);">練</span><span class="section-title-text">練習問題</span></div>';
    INFO_DRILLS.forEach((d,i)=>{
      const dsp=d.ans.join(' ')+(d.mark==='?'?'?':'.');
      drillHtml+='<div class="drill-box"><div class="drill-num">'+d.num+'</div><div class="drill-src">'+d.src+'&nbsp;<button class="voice-btn" style="font-size:1.1em;vertical-align:middle;" data-sp="'+dsp+'" onclick="event.stopPropagation();speak(this.dataset.sp)">🔊</button></div><div class="bracket-row" id="dr'+i+'">';
      d.ans.forEach((w,j)=>{
        const cls=challenging?'bk':'bk filled';
        const txt=challenging?'　':' '+w;
        drillHtml+='<button class="'+cls+'" data-ans="'+w+'" data-d="'+i+'" onclick="clickDrill(this)">'+txt+'</button>';
        // Yes, / No, の後にカンマを表示
        if(j===0&&(w==='Yes'||w==='No')){
          drillHtml+='<span style="font-size:1em;font-weight:700;align-self:center;margin:0 2px 0 -4px;">,</span>';
        }
      });
      drillHtml+='<span style="font-size:1.1em;font-weight:700;align-self:center;padding-left:2px;">'+d.mark+'</span>';
      drillHtml+='</div></div>';
    });
    drillHtml+='</div>';
    area.innerHTML=applyImp(INFO_HTML)+drillHtml;
  }else{
    const label=mode==='ex'?'【例題】':mode==='prac'?'【類題】':'【テスト】';
    let html='<div class="section"><h2 style="font-size:1em;margin-bottom:12px;">'+label+'</h2>';
    MASTER_DATA[mode].forEach(q=>{
      html+='<div class="sentence-block">';
      const sp=q.en.join(' ')+(q.mark==='?'?'?':'.');
      html+='<div class="sentence-jp">'+q.jp+'&nbsp;<button class="voice-btn" style="font-size:1.1em;vertical-align:middle;" data-sp="'+sp+'" onclick="event.stopPropagation();speak(this.dataset.sp)">🔊</button></div>';
      html+='<div class="word-squares">';
      q.en.forEach((w,i)=>{
        const cls=challenging?'sq':'sq filled';
        const inner=challenging?'　':wrapW(w);
        html+='<button class="'+cls+'" data-ans="'+w+'" onclick="clickSq(this)">'+inner+'</button>';
        // Yes, / No, の後にカンマを表示
        if(i===0&&(w==='Yes'||w==='No')){
          html+='<span style="font-size:1em;font-weight:700;align-self:center;margin:0 2px 0 -4px;">,</span>';
        }
      });
      html+='<span style="font-size:1.1em;font-weight:700;align-self:center;padding-left:2px;">'+q.mark+'</span>';
      html+='</div></div>';
    });
    html+='</div>';
    area.innerHTML=html;
  }
}

// ===== クリック処理 =====
function clickSq(el){
  if(!challenging||!selWord||el.classList.contains('filled'))return;
  if(selWord===el.dataset.ans){
    el.innerHTML=wrapW(selWord); el.classList.add('filled');
    // 使った語群カードを消す
    const card=document.getElementById(selId);
    if(card){card.style.display='none';}
    selWord=null; selId=null;
    document.getElementById('pool-sel-label').textContent='選択中：なし';
    if([...document.querySelectorAll('.sq')].every(s=>s.classList.contains('filled')))finish();
  }else alert('もうチョイ！');
}

function clickDrill(el){
  if(!challenging||!selWord||el.classList.contains('filled'))return;
  if(selWord===el.dataset.ans){
    el.textContent=' '+selWord; el.classList.add('filled');
    // 使った語群カードを消す
    const card=document.getElementById(selId);
    if(card){card.style.display='none';}
    selWord=null; selId=null;
    document.getElementById('pool-sel-label').textContent='選択中：なし';
    if([...document.querySelectorAll('.bk')].every(s=>s.classList.contains('filled')))finish();
  }else alert('もうチョイ！');
}

function showAnswers(){
  if(mode==='info'){
    document.querySelectorAll('.bk').forEach(el=>{el.textContent=' '+el.dataset.ans;el.classList.add('filled');});
  }else{
    document.querySelectorAll('.sq').forEach(el=>{el.innerHTML=wrapW(el.dataset.ans);el.classList.add('filled');});
  }
  stopChallenge();
}

// ===== チャレンジ =====
function buildPool(){
  const pi=document.getElementById('pool-inner'); pi.innerHTML='';
  const words=(mode==='info'?INFO_DRILLS.flatMap(d=>d.ans):MASTER_DATA[mode].flatMap(q=>q.en))
    .slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  words.forEach((w,i)=>{
    const c=document.createElement('button');
    c.className='wcard'; c.id='wc'+i; c.textContent=w;
    c.addEventListener('click',()=>{
      selWord=w; selId='wc'+i;
      document.querySelectorAll('.wcard').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      document.getElementById('pool-sel-label').textContent='選択中：'+w;
      // 選択したら語群を閉じて文を見やすくする
      poolOpen=false;
      document.getElementById('pool').style.display='none';
      document.getElementById('pool-toggle-label').textContent='📝 語群を開く ▲';
    });
    pi.appendChild(c);
  });
}

let poolOpen=false;
function togglePool(){
  poolOpen=!poolOpen;
  document.getElementById('pool').style.display=poolOpen?'block':'none';
  document.getElementById('pool-toggle-label').textContent=poolOpen?'📝 語群を閉じる ▼':'📝 語群を開く ▲';
}
function startChallenge(){
  challenging=true; poolOpen=false;
  document.getElementById('start-btn').style.display='none';
  document.getElementById('cc').classList.add('show');
  document.getElementById('pool').style.display='none';
  document.getElementById('pool-toggle-bar').style.display='block';
  document.getElementById('pool-toggle-label').textContent='📝 語群を開く ▲';
  document.getElementById('pool-sel-label').textContent='選択中：なし';
  buildPool(); render();
  startT=Date.now();
  timerIv=setInterval(()=>{document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-startT)/1000));},500);
}

function stopChallenge(){
  challenging=false; poolOpen=false; clearInterval(timerIv);
  document.getElementById('pool').style.display='none';
  document.getElementById('pool-toggle-bar').style.display='none';
  document.getElementById('start-btn').style.display='block';
  document.getElementById('cc').classList.remove('show');
}

function retryChallenge(){stopChallenge();render();}

function finish(){
  clearInterval(timerIv);
  const t=fmt(Math.floor((Date.now()-startT)/1000));
  document.getElementById('timer').textContent=t;
  doneSteps[mode]=true;
  document.getElementById('btn-'+mode).classList.add('completed');
  stopChallenge();
  const idx=recs.indexOf(null); if(idx>=0){recs[idx]=t;document.getElementById('r'+idx).textContent=t;saveRec();}
  if(doneSteps.ex&&doneSteps.prac&&doneSteps.test&&typeof markPassed==='function')markPassed('EA01');
  if(doneSteps.info&&doneSteps.ex&&doneSteps.prac&&doneSteps.test){
    setTimeout(launchConfetti,300);
  }
}

// ===== レコード =====
function saveRec(){try{localStorage.setItem(REC_KEY,JSON.stringify(recs));}catch(e){}}
function loadRec(){try{const r=JSON.parse(localStorage.getItem(REC_KEY));if(Array.isArray(r)){recs=r;recs.forEach((t,i)=>{if(t)document.getElementById('r'+i).textContent=t;});}}catch(e){}}
function resetRec(){recs=[null,null,null,null,null];for(let i=0;i<5;i++)document.getElementById('r'+i).textContent='--:--';try{localStorage.removeItem(REC_KEY);}catch(e){}}

// ===== 単語ポップアップ =====
function parseKana(val){
  const m=val.match(/^(.*?)\s*(\(.*)/);
  if(!m)return{kana:val,meaning:''};
  return{kana:m[1].replace(/【(.*?)】/g,'<strong>$1</strong>'),meaning:m[2]};
}

let _closeTimer=null;
function openPopup(key){
  if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;}
  ppWord=key;
  const {kana,meaning}=parseKana(DICT[key]);
  document.getElementById('pp-word').textContent=key;
  document.getElementById('pp-kana').innerHTML=kana;
  document.getElementById('pp-meaning').textContent=meaning;
  const sv=getVocab();
  const btn=document.getElementById('pp-save');
  if(sv.some(v=>v.word===key)){btn.textContent='✅ 保存済み';btn.className='popup-btn popup-save saved';}
  else{btn.textContent='📗 単語帳に保存';btn.className='popup-btn popup-save';}
  // ポップアップの位置を単語の近くに表示（PC）
  document.getElementById('popup').classList.add('show');
  speak(key);
}
function scheduleClose(){
  _closeTimer=setTimeout(()=>{
    document.getElementById('popup').classList.remove('show');
    _closeTimer=null;
  },300);
}

function closePopup(e){
  if(e.target===document.getElementById('popup')){
    if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;}
    document.getElementById('popup').classList.remove('show');
  }
}
function closePopupBtn(){
  if(_closeTimer){clearTimeout(_closeTimer);_closeTimer=null;}
  document.getElementById('popup').classList.remove('show');
}
function ppSpeak(){if(ppWord)speak(ppWord);}

function ppSave(){
  if(!ppWord)return;
  const sv=getVocab();
  if(sv.some(v=>v.word===ppWord))return;
  const {kana,meaning}=parseKana(DICT[ppWord]);
  const plain=DICT[ppWord].replace(/【|】/g,'').split(' ')[0];
  sv.push({word:ppWord,kana:plain,meaning});
  setVocab(sv);
  document.getElementById('pp-save').textContent='✅ 保存済み';
  document.getElementById('pp-save').className='popup-btn popup-save saved';
  renderVocab();
}

// ===== 単語帳 =====
function getVocab(){try{return JSON.parse(localStorage.getItem(VOCAB_KEY))||[];}catch(e){return[];}}
function setVocab(a){try{localStorage.setItem(VOCAB_KEY,JSON.stringify(a));}catch(e){}}

function renderVocab(){
  const sv=getVocab();
  const el=document.getElementById('vocab-list');
  const em=document.getElementById('vocab-empty');
  if(!sv.length){el.innerHTML='';em.style.display='block';return;}
  em.style.display='none';
  el.innerHTML=sv.map((v,i)=>'<div class="vocab-item"><span class="vocab-word">'+v.word+'</span><span class="vocab-info">'+v.kana+'　'+v.meaning+'</span><button class="vocab-del" onclick="delVocab('+i+')">✕</button></div>').join('');
}

function delVocab(i){const sv=getVocab();sv.splice(i,1);setVocab(sv);renderVocab();}

// ===== 単語テスト =====
let vtW=null, vtScore={c:0,t:0};

function startVtest(){
  const sv=getVocab();
  if(sv.length<2){alert('単語帳に2語以上保存してから始めましょう！');return;}
  vtScore={c:0,t:0}; nextVtest();
}

function nextVtest(){
  const sv=getVocab();
  if(!sv.length)return;
  vtW=sv[Math.floor(Math.random()*sv.length)];
  const correct=vtW.meaning;
  let choices=[correct];
  sv.filter(v=>v.word!==vtW.word).sort(()=>Math.random()-.5).forEach(v=>{if(choices.length<4&&!choices.includes(v.meaning))choices.push(v.meaning);});
  // 足りなければDICTから補充
  if(choices.length<4){
    Object.entries(DICT).filter(([k])=>!sv.some(v=>v.word===k)).sort(()=>Math.random()-.5).forEach(([k,v])=>{
      if(choices.length<4){const m=parseKana(v).meaning;if(!choices.includes(m))choices.push(m);}});
  }
  choices.sort(()=>Math.random()-.5);
  const area=document.getElementById('vtest-area');
  area.style.display='block';
  area.innerHTML='<div class="section"><div class="vtest-q">'+vtW.word+'<br><small style="font-size:.6em;color:var(--text-sub);">'+vtW.kana+'</small></div><div class="vtest-grid">'+
    choices.map(c=>'<button class="vtest-btn" data-c="'+encodeURIComponent(c)+'" data-ok="'+(c===correct)+'" onclick="checkVtest(this)">'+c+'</button>').join('')+
    '</div><div class="vtest-result" id="vr" style="display:none;"></div></div>';
}

function checkVtest(btn){
  document.querySelectorAll('.vtest-btn').forEach(b=>b.disabled=true);
  vtScore.t++;
  const ok=(btn.dataset.ok==='true');
  btn.classList.add(ok?'ok':'ng');
  if(!ok)document.querySelectorAll('.vtest-btn').forEach(b=>{if(b.dataset.ok==='true')b.classList.add('ok');});
  if(ok)vtScore.c++;
  const vr=document.getElementById('vr');
  vr.style.display='block';
  vr.innerHTML=(ok?'⭕ 正解！':'❌ 不正解')+' <span style="color:var(--text-sub);font-size:.88em;">'+vtScore.c+'/'+vtScore.t+'問正解</span><br><button class="vtest-next" onclick="nextVtest()">次の問題 →</button>';
}


// ===== 花吹雪 =====
function launchConfetti(){
  const colors=['#e8372d','#1a56a0','#16a34a','#f97316','#7e22ce','#d97706','#ec4899','#06b6d4','#fbbf24','#a3e635'];
  const shapes=['■','●','▲','★','♥','♦'];
  for(let i=0;i<120;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='confetti-piece';
      el.textContent=shapes[Math.floor(Math.random()*shapes.length)];
      el.style.cssText=[
        'left:'+Math.random()*100+'vw',
        'color:'+colors[Math.floor(Math.random()*colors.length)],
        'font-size:'+(8+Math.random()*12)+'px',
        'animation-duration:'+(1.5+Math.random()*2)+'s',
        'animation-delay:'+Math.random()*0.5+'s',
        'width:auto','height:auto','background:none'
      ].join(';');
      document.body.appendChild(el);
      el.addEventListener('animationend',()=>el.remove());
    }, i*15);
  }
}


function applyImp(html){
  Object.keys(DICT).sort((a,b)=>b.length-a.length).forEach(function(k){
    // >テキスト< の形でタグ外のテキストのみ置換
    html=html.replace(/>([^<]+)</g,function(m,txt){
      var esc=JSON.stringify(k).replace(/\"/g,'&quot;');
      var span='<span class="imp" onmouseenter="openPopup('+esc+')" onmouseleave="scheduleClose()" ontouchstart="event.preventDefault();openPopup('+esc+')">$1</span>';
      // 単語として出現する場合のみ置換（前後が英字・アポストロフィ以外）
      var safeK=k.replace(/[.*+?\^${}()|]/g,'\\$&').replace('[','\\[').replace(']','\\]');
      var re=new RegExp('(^|[^A-Za-z\'\\-])('+safeK+')([^A-Za-z\'\\-]|$)','gi');
      var replaced=txt.replace(re,function(whole,pre,word,post){
        return pre+'<span class="imp" onmouseenter="openPopup('+esc+')" onmouseleave="scheduleClose()" ontouchstart="event.preventDefault();openPopup('+esc+')">'+word+'</span>'+post;
      });
      return '>'+replaced+'<';
    });
  });
  return html;
}
window.addEventListener('load',()=>{loadRec();renderVocab();goStep('info');});
